name: CI

on:
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same PR when new commits land.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: typecheck + test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Project requires Node >= 22.6 (uses --experimental-strip-types).
        node-version: ['22.x', '24.x']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  # Phase 13.3: incremental reduce is the DEFAULT — this job re-runs the whole suite with
  # every incremental result cross-checked against a full reduce (throws on divergence).
  # Kept as a dedicated job so the determinism net stays wide without slowing the hot path.
  verify-incremental:
    name: test (AVCS_VERIFY_INCREMENTAL=1)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test (incremental self-verify)
        run: npm test
        env:
          AVCS_VERIFY_INCREMENTAL: '1'

  conformance:
    # 적합성 스위트를 참조 구현에 대고 돌린다. 이것이 초록이어야 스위트가 스스로 검증된다 —
    # 제3자가 자기 서버에 대고 돌리는 것과 **같은 명령**이고, 다른 것은 URL 하나뿐이다:
    #   AVCS_CONFORMANCE_URL=https://your.hub/acme/web npm run conformance
    #
    # 별도 잡인 이유: node 의 테스트 러너 안에서 러너를 다시 부를 수 없다
    # (`run() is being called recursively within a test file. skipping running files.`).
    # 테스트로 흉내내면 초록이 나되 아무 파일도 돌지 않는다.
    name: conformance (reference server)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Conformance suite
        run: npm run conformance

  release-dry-run:
    name: release dry run (build + pack)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Mirror the release build so packaging regressions surface at PR time.
      # (typecheck + test are covered by the `test` job above.) We use
      # `npm pack --dry-run` rather than `npm publish --dry-run`: pack reports the
      # exact tarball contents a real release would ship — exercising the same
      # `files`/`exports`/ignore rules — without contacting the registry. A
      # publish dry run would additionally fail with "cannot publish over previously
      # published versions" on every PR that doesn't bump the version, which is not
      # a packaging error and must not block PRs.
      - name: Build
        run: npm run build

      - name: Pack (verify the release tarball contents)
        run: npm pack --dry-run
