name: PR body

# PR 본문에 이미지를 싣지 않는다. 스크린샷은 내부 화면·개인정보를 담기 쉽고, 올린 첨부는
# 본문을 고쳐도 URL 로 계속 열린다. 본문을 고칠 때(edited)도 다시 돈다 — 무거운 CI 와
# 따로 두어 편집마다 전체 스위트가 돌지 않게 한다.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  no-images:
    name: PR body has no images
    runs-on: ubuntu-latest
    steps:
      - name: Check PR body
        # 본문은 env 로만 넘긴다 — 식(${{ }})을 run 안에 직접 펴면 본문이 셸 코드가 된다.
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          set -eu
          PATTERN='!\[[^]]*\]\(|<img[[:space:]>/]|<picture[[:space:]>]|github\.com/user-attachments/|user-images\.githubusercontent\.com|private-user-images\.githubusercontent\.com|raw\.githubusercontent\.com|github\.com/[^[:space:])]+/raw/|[?&]raw=true'
          hits="$(printf '%s\n' "${BODY:-}" | grep -niE "$PATTERN" || true)"
          if [ -n "$hits" ]; then
            printf '%s\n' "$hits" | cut -d: -f1 | while read -r n; do
              echo "::error::PR body line $n contains an image or raw link — describe it in text instead"
            done
            exit 1
          fi
          echo "no images in PR body"
