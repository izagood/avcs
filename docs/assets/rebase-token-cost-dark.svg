<text class="note" x="28" y="360">git's cost follows the size of the FILE — it reads and rewrites the whole thing. AVCS's follows the</text>
<text class="note" x="28" y="376">size of the CHANGE: flat 279 tokens at every size, 68× less on a 30 KB file.</text>
<text class="note" x="28" y="392">Round trips: git 7 vs AVCS 4 — and this is ONE cycle, repeated for every PR that merges ahead of yours.</text>
</g></svg>
